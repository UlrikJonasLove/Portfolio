<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Projekt av Ulrik Rosberg - Systemutvecklare." />
  <title>Projekt | Ulrik Rosberg</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: {
              400: '#2dd4bf',
              500: '#14b8a6'
            }
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(45,212,191,.25), 0 0 24px rgba(45,212,191,.12)'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background: radial-gradient(circle at 10% 10%, rgba(20, 184, 166, 0.08), transparent 35%),
                  radial-gradient(circle at 90% 0%, rgba(15, 23, 42, 0.5), transparent 33%),
                  #020617;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(148, 163, 184, 0.04) 0px,
        rgba(148, 163, 184, 0.04) 1px,
        transparent 2px,
        transparent 4px
      );
      opacity: 0.35;
      mix-blend-mode: screen;
      z-index: 40;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(148, 163, 184, 0.08) 0.5px, transparent 0.5px);
      background-size: 3px 3px;
      opacity: 0.12;
      z-index: 41;
    }
    .panel {
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: linear-gradient(165deg, rgba(15, 23, 42, 0.75), rgba(2, 6, 23, 0.9));
      backdrop-filter: blur(4px);
    }
    .panel:hover {
      border-color: rgba(45, 212, 191, 0.45);
      box-shadow: 0 0 0 1px rgba(45,212,191,.2), 0 0 24px rgba(45,212,191,.09);
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>
</head>
<body data-page="projects" class="text-slate-100 antialiased min-h-screen">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:bg-teal-300 focus:text-slate-950 focus:px-3 focus:py-2 focus:rounded">Hoppa till innehåll</a>

  <header class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/85 backdrop-blur">
    <nav aria-label="Huvudnavigering" class="mx-auto max-w-6xl px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <a href="./index.html" class="font-semibold tracking-wide text-teal-300"><span data-owner-name>Ulrik Rosberg</span></a>
      <ul class="flex items-center gap-4 sm:gap-6 text-sm text-slate-300">
        <li><a href="./index.html#about" class="hover:text-teal-300 transition">Om</a></li>
        <li><a href="./projects.html" class="text-teal-300 transition">Projekt</a></li>
        <li><a href="./index.html#services" class="hover:text-teal-300 transition">Tjänster</a></li>
        <li><a href="./index.html#contact" class="hover:text-teal-300 transition">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="mx-auto max-w-6xl px-4 sm:px-6 py-10 sm:py-14 space-y-8">
    <div id="page-error-root" aria-live="polite"></div>

    <section aria-label="Projektöversikt" class="panel rounded-2xl p-6 sm:p-8">
      <p class="mono text-xs uppercase tracking-[0.2em] text-slate-400">PROJEKT_INDEX</p>
      <h1 class="mt-2 text-3xl sm:text-4xl font-bold tracking-tight">Projekt av <span data-owner-name>Ulrik Rosberg</span></h1>
      <p class="mt-4 text-slate-300 max-w-3xl">Filtrera efter teknik eller sök på titel och beskrivning för att hitta rätt case.</p>
    </section>

    <section aria-label="Projektfilter" class="space-y-4">
      <div id="projects-controls-root"></div>
      <div id="projects-grid-root"></div>
    </section>
  </main>

  <footer id="footer-root" class="border-t border-slate-800/80 mt-8"></footer>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
